name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.26" "scipy>=1.11" "mujoco>=3.2" "matplotlib>=3.8" "pytest>=8.0" ruff
      - name: Lint (syntax errors and undefined names, see ruff.toml)
        run: ruff check .
      - name: Run tests (includes the JavaScript demo model against PyTorch)
        env:
          CUDA_VISIBLE_DEVICES: ""
          MUJOCO_GL: disable  # the tests never render; skip importing an OpenGL backend the runner does not have
        run: python -m pytest -q tests
